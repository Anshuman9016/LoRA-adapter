# ---------------------------------------------------------------------------
# All the knobs for a LoRA fine-tuning run live here, so you never have to
# edit scripts/train.py just to try a different learning rate or model.
# ---------------------------------------------------------------------------

model:
  # Any causal-LM on the Hugging Face Hub works. Start small so a first run
  # finishes in minutes, not hours.
  name: "distilgpt2"
  # If you have a GPU with >=16GB VRAM, try: "meta-llama/Llama-3.2-1B" or "microsoft/phi-2"
  load_in_4bit: false   # set true on larger models to save VRAM (needs bitsandbytes + CUDA)

data:
  train_file: "data/train.jsonl"
  eval_file: "data/eval.jsonl"
  text_field: "text"       # the JSON key holding the training text
  max_seq_length: 512

lora:
  r: 8                     # rank of the LoRA update matrices — higher = more capacity, more params
  lora_alpha: 16            # scaling factor, usually 2x r
  lora_dropout: 0.05
  bias: "none"
  # Which weight matrices inside each transformer block get a LoRA adapter.
  # For GPT-2 style models these are named this way; for Llama/Mistral use
  # ["q_proj", "k_proj", "v_proj", "o_proj"] instead (see docs/03_training_guide.md).
  target_modules: ["c_attn"]

training:
  output_dir: "outputs/lora-run-1"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  warmup_ratio: 0.03
  logging_steps: 10
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 2
  bf16: false                # set true if your GPU supports bfloat16 (Ampere+)
  seed: 42
